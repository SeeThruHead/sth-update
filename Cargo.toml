[package]
name = "sth-update"
version = "0.1.3"
edition = "2024"
description = "Keeps the tools from one Homebrew tap current on this machine, and restarts their services"
license = "MIT"
repository = "https://github.com/SeeThruHead/sth-update"
readme = "README.md"
keywords = ["homebrew", "updater", "daemon"]
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
